version: "2"
linters:
  default: none
  enable:
    - copyloopvar
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - misspell
    - nilerr
    - revive
    - staticcheck
    - unparam
    - unused
    - whitespace
  settings:
    gocritic:
      disabled-checks:
        # gopher-lua's own API names the state parameter `L *lua.LState`.
        - captLocal
    # An explicit rules list runs only the rules named here. `exported` is left
    # out on purpose: the `comments` exclusion preset below suppresses the
    # doc-comment reports that make up most of what it finds.
    revive:
      rules:
        - name: error-return
        - name: error-naming
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - unparam
        path: _test\.go
      - linters:
          - unparam
        path: internal/surface/tui/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
