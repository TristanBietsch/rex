run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - ineffassign
    - unused
    - gofmt
    - goimports
    - misspell
    - unparam
    - whitespace

linters-settings:
  revive:
    rules:
      - name: exported
      - name: error-return
      - name: error-naming
      - name: unused-parameter
        disabled: true

issues:
  exclude-rules:
    # Test helpers often keep parameters for documentation or future assertions.
    - path: _test\.go
      linters:
        - unparam
    # Bubble Tea Update handlers and wizard render steps use uniform signatures by design.
    - path: internal/surface/tui/
      linters:
        - unparam
