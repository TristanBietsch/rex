name: stress

# Repeats the daemon and wire tests under the race detector to shake out
# flaky interleavings that a single CI run rarely hits.
on:
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # oto (TUI sounds) links ALSA via cgo on Linux.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Race tests x50 (daemon, wire)
        run: go test -race -count=50 -timeout=45m ./internal/daemon/... ./internal/wire/...
