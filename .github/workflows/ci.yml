name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push to a PR supersedes the run in flight. Runs on master are
# never cancelled, so every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs the full gate, including the GOOS=windows lint and
          # the coverage floors.
          - os: ubuntu-latest
            targets: check
          - os: macos-latest
            targets: vet test-race lint vuln
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # oto (TUI sounds) links ALSA via cgo on Linux.
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build
        run: make build

      - name: Check (${{ matrix.targets }})
        run: make ${{ matrix.targets }}

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Install (install.ps1 -FromSource)
        shell: pwsh
        run: ./install.ps1 -FromSource -Prefix "$env:RUNNER_TEMP\rex" -NoPath

      # The release path of install.ps1 against a local file:// mirror built
      # from the binaries above: a good zip installs, a bad checksum and a
      # missing release install nothing.
      - name: Install from a release mirror (install.ps1)
        shell: pwsh
        run: |
          $ver = '0.0.0-ci'
          $name = "rex_${ver}_windows_amd64"
          $mirror = Join-Path $env:RUNNER_TEMP 'mirror'
          $dl = Join-Path $mirror "download\v$ver"
          $stage = Join-Path $env:RUNNER_TEMP "stage\$name"
          New-Item -ItemType Directory -Force -Path $dl, $stage | Out-Null
          Copy-Item .\rex.exe, .\rex-daemon.exe $stage
          $zip = Join-Path $dl "$name.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory($stage, $zip, 'Optimal', $true)
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path (Join-Path $dl 'SHA256SUMS') -Value "$hash  $name.zip"
          $env:REX_DOWNLOAD_URL = ([Uri]$mirror).AbsoluteUri
          $prefix = Join-Path $env:RUNNER_TEMP 'rex-release'
          ./install.ps1 -Version "v$ver" -Prefix $prefix
          if ($LASTEXITCODE -ne 0) { Write-Error 'release install failed'; exit 1 }
          if (-not (Test-Path "$prefix\bin\rex.exe")) { Write-Error 'rex.exe not installed'; exit 1 }
          if (-not (Test-Path "$prefix\bin\rex-daemon.exe")) { Write-Error 'rex-daemon.exe not installed'; exit 1 }
          Set-Content -Path (Join-Path $dl 'SHA256SUMS') -Value ("0" * 64 + "  $name.zip")
          $bad = Join-Path $env:RUNNER_TEMP 'rex-bad'
          pwsh -NoProfile -File ./install.ps1 -Version "v$ver" -Prefix $bad
          if ($LASTEXITCODE -eq 0) { Write-Error 'bad checksum was accepted'; exit 1 }
          if (Test-Path "$bad\bin\rex.exe") { Write-Error 'bad checksum installed rex.exe'; exit 1 }
          pwsh -NoProfile -File ./install.ps1 -Version 'v9.9.9' -Prefix $bad
          if ($LASTEXITCODE -eq 0) { Write-Error 'missing release was accepted'; exit 1 }
          exit 0

      - name: Smoke (daemon start, echo session, stop)
        shell: pwsh
        run: |
          $rex = "$env:RUNNER_TEMP\rex\bin\rex.exe"
          & $rex daemon start
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $rex new --tool echo --model short --slug smoke "smoke"
          Start-Sleep -Seconds 5
          & $rex ls
          & $rex daemon stop
          Start-Sleep -Seconds 2
          & $rex daemon status
          if ($LASTEXITCODE -eq 0) { Write-Error 'daemon still running after stop'; exit 1 }
          exit 0
