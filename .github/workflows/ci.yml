name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # oto (TUI sounds) links ALSA via cgo on Linux.
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build
        run: make build

      - name: Check (vet, race tests, lint, govulncheck)
        run: make check

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # -race needs cgo, and cgo on Windows needs gcc: the runner image ships
      # MinGW-w64 on PATH. One command per step, because pwsh only fails a
      # step on the last native command's exit code.
      - name: Check gcc (race detector)
        run: gcc --version

      - name: Test (race)
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

      - name: Test third_party/vt10x (race)
        env:
          CGO_ENABLED: '1'
        run: go -C third_party/vt10x test -race ./...

      - name: Install (install.ps1)
        shell: pwsh
        run: ./install.ps1 -Prefix "$env:RUNNER_TEMP\rex" -NoPath

      - name: Smoke (daemon start, echo session, stop)
        shell: pwsh
        run: |
          $rex = "$env:RUNNER_TEMP\rex\bin\rex.exe"
          # Native commands do not throw on a non-zero exit; check each one.
          function Check($what) {
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::$what exited $LASTEXITCODE"; exit 1 }
          }
          & $rex daemon start
          Check 'rex daemon start'
          & $rex new --tool echo --model short --slug smoke "smoke"
          Check 'rex new'
          # Blocks until the echo session ends (done, failed or crashed).
          & $rex wait -until any -timeout 30s smoke
          Check 'rex wait'
          & $rex ls
          Check 'rex ls'
          & $rex daemon stop
          Check 'rex daemon stop'
          Start-Sleep -Seconds 2
          & $rex daemon status
          if ($LASTEXITCODE -eq 0) { Write-Error 'daemon still running after stop'; exit 1 }
          exit 0
